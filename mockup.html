<body>
<main>
  <header>
    <h1>Daily Reminder Delights</h1>
    <select id=&quot;themeSel&quot; title=&quot;Theme&quot; aria-label=&quot;Theme&quot;>
      <option value=&quot;light&quot;>&amp;#9728;&amp;#65039; Light</option>
      <option value=&quot;dark&quot;>&amp;#127769; Dark</option>
    </select>
  </header>
  <div id=&quot;alert&quot; role=&quot;alert&quot; hidden></div>
  <form id=&quot;form&quot;>
    <input type=&quot;text&quot; id=&quot;input&quot; class=&quot;task&quot; placeholder=&quot;Add a task...&quot; autocomplete=&quot;off&quot;>
    <select id=&quot;newCat&quot; class=&quot;cat&quot; title=&quot;Category&quot;>
      <option>Home</option>
      <option>Work</option>
      <option selected>Others</option>
    </select>
    <input type=&quot;date&quot; id=&quot;newDue&quot; title=&quot;Due date&quot;>
    <select id=&quot;newPri&quot; title=&quot;Priority&quot;>
      <option value=&quot;high&quot;>High</option>
      <option value=&quot;medium&quot; selected>Medium</option>
      <option value=&quot;low&quot;>Low</option>
    </select>
    <button type=&quot;submit&quot;>Add</button>
  </form>
  <ul id=&quot;list&quot;></ul>
</main>
<script>
  const ORDER = { high: 0, medium: 1, low: 2 };
  const CATS = ['Home', 'Work', 'Others'];

  // ---- Theme ----
  const themeSel = document.getElementById('themeSel');
  let theme = null;
  try { theme = localStorage.getItem('theme'); } catch (e) {}
  if (theme !== 'light' &amp;&amp; theme !== 'dark') {
    theme = window.matchMedia &amp;&amp; matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    themeSel.value = t;
  }
  applyTheme(theme);
  themeSel.onchange = () => {
    applyTheme(themeSel.value);
    try { localStorage.setItem('theme', themeSel.value); } catch (e) {}
  };

  // ---- Data ----
  let todos = [];
  try { todos = JSON.parse(localStorage.getItem('todos')) || []; } catch (e) {}
  todos.forEach(t => {
    if (!ORDER.hasOwnProperty(t.priority)) t.priority = 'medium';
    if (!CATS.includes(t.category)) t.category = 'Others'; // older free-text categories
    t.due = t.due || '';
  });

  let editing = null; // the todo object currently being edited

  const list = document.getElementById('list');
  const input = document.getElementById('input');

  function save() {
    try { localStorage.setItem('todos', JSON.stringify(todos)); } catch (e) {}
  }

  function today() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function tomorrow() {
    const d = new Date();
    d.setDate(d.getDate() + 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function renderAlert() {
    const el = document.getElementById('alert');
    const tm = tomorrow();
    const soon = todos.filter(t => !t.done &amp;&amp; t.due === tm);
    if (!soon.length) { el.hidden = true; return; }
    el.textContent = '⏰ Due tomorrow: ' + soon.map(t => t.text).join(', ');
    el.hidden = false;
  }

  function fmtDate(s) {
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function btn(label, cls, fn) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'small ' + cls;
    b.textContent = label;
    const names = { '✏️': 'Edit', '🗑️': 'Delete' };
    if (names[label]) { b.title = names[label]; b.setAttribute('aria-label', names[label]); }
    b.onclick = fn;
    return b;
  }

  function priSelect(value, onchange) {
    const sel = document.createElement('select');
    sel.title = 'Priority';
    ['high', 'medium', 'low'].forEach(p => {
      const o = document.createElement('option');
      o.value = p;
      o.textContent = p[0].toUpperCase() + p.slice(1);
      if (p === value) o.selected = true;
      sel.appendChild(o);
    });
    if (onchange) sel.onchange = onchange;
    return sel;
  }

  function catSelect(value) {
    const sel = document.createElement('select');
    sel.title = 'Category';
    CATS.forEach(c => {
      const o = document.createElement('option');
      o.value = o.textContent = c;
      if (c === value) o.selected = true;
      sel.appendChild(o);
    });
    return sel;
  }

  function render() {
    list.innerHTML = '';
    renderAlert();
    // Sort: category group (Home, Work, Others), then priority (high first),
    // then due date (earliest first, none last), then added order
    const sorted = todos.slice().sort((a, b) =>
      CATS.indexOf(a.category) - CATS.indexOf(b.category) ||
      ORDER[a.priority] - ORDER[b.priority] ||
      (a.due || '9999').localeCompare(b.due || '9999'));
    let lastCat = null;
    sorted.forEach(t => {
      if (t.category !== lastCat) {
        lastCat = t.category;
        const h = document.createElement('li');
        h.className = 'group';
        h.textContent = t.category;
        list.appendChild(h);
      }
      const li = document.createElement('li');
      li.className = 'p-' + t.priority + (t.done ? ' done' : '');

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = t.done;
      cb.onchange = () => { t.done = cb.checked; save(); render(); };
      li.appendChild(cb);

      if (editing === t) {
        const box = document.createElement('div');
        box.className = 'editbox';
        const ti = document.createElement('input');
        ti.type = 'text'; ti.value = t.text; ti.placeholder = 'Task';
        const cs = catSelect(t.category);
        const di = document.createElement('input');
        di.type = 'date'; di.value = t.due;
        const ps = priSelect(t.priority);
        const commit = () => {
          const v = ti.value.trim();
          if (v) t.text = v;
          t.category = cs.value;
          t.due = di.value;
          t.priority = ps.value;
          editing = null; save(); render();
        };
        ti.onkeydown = e => {
          if (e.key === 'Enter') commit();
          if (e.key === 'Escape') { editing = null; render(); }
        };
        box.append(ti, cs, di, ps,
          btn('Save', '', commit),
          btn('Cancel', 'edit', () => { editing = null; render(); }));
        li.appendChild(box);
        list.appendChild(li);
        setTimeout(() => { ti.focus(); ti.select(); });
        return;
      }

      const main = document.createElement('div');
      main.className = 'main';
      const span = document.createElement('div');
      span.className = 'text';
      span.textContent = t.text;
      main.appendChild(span);

      const meta = document.createElement('div');
      meta.className = 'meta';
      const b = document.createElement('span');
      b.className = 'badge';
      b.textContent = t.category;
      meta.appendChild(b);
      if (t.due) {
        const d = document.createElement('span');
        const overdue = t.due < today();
        const isSoon = t.due === tomorrow();
        d.className = 'due' + (overdue ? ' overdue' : isSoon ? ' soon' : '');
        d.textContent = isSoon ? 'Due tomorrow' : (overdue ? 'Overdue: ' : 'Due: ') + fmtDate(t.due);
        meta.appendChild(d);
      }
      main.appendChild(meta);
      li.appendChild(main);

      const sel = priSelect(t.priority);
      sel.className = 'pri';
      sel.onchange = () => { t.priority = sel.value; save(); render(); };
      li.appendChild(sel);

      li.appendChild(btn('✏️', 'edit', () => { editing = t; render(); }));
      li.appendChild(btn('🗑️', 'del', () => {
        todos.splice(todos.indexOf(t), 1);
        if (editing === t) editing = null;
        save(); render();
      }));
      list.appendChild(li);
    });
  }

  document.getElementById('form').onsubmit = e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    todos.push({
      text,
      done: false,
      priority: document.getElementById('newPri').value,
      category: document.getElementById('newCat').value,
      due: document.getElementById('newDue').value
    });
    input.value = '';
    document.getElementById('newDue').value = '';
    save(); render();
  };

  todos.length = 0;
  todos.push(
    { text: 'Buy boiler', done: false, priority: 'high', category: 'Home', due: tomorrow() },
    { text: 'Send quarterly report to the whole finance team', done: false, priority: 'medium', category: 'Work', due: '2099-03-01' },
    { text: 'Call mum', done: false, priority: 'low', category: 'Others', due: '' },
    { text: 'Book dentist', done: true, priority: 'low', category: 'Others', due: '' }
  );
  save = function () {};
  document.body.style.paddingTop = '40px'; /* room for the phone's notch / status bar */
  render();
</script>
</body>
</html>

  let todos = [];
  try { todos = JSON.parse(localStorage.getItem('todos')) || []; } catch (e) {}
  todos.forEach(t => {
    if (!ORDER.hasOwnProperty(t.priority)) t.priority = 'medium';
    if (!CATS.includes(t.category)) t.category = 'Others'; // older free-text categories
    t.due = t.due || '';
  });

  let editing = null; // the todo object currently being edited

  const list = document.getElementById('list');
  const input = document.getElementById('input');

  function save() {
    try { localStorage.setItem('todos', JSON.stringify(todos)); } catch (e) {}
  }

  function today() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function tomorrow() {
    const d = new Date();
    d.setDate(d.getDate() + 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function renderAlert() {
    const el = document.getElementById('alert');
    const tm = tomorrow();
    const soon = todos.filter(t => !t.done &amp;&amp; t.due === tm);
    if (!soon.length) { el.hidden = true; return; }
    el.textContent = '⏰ Due tomorrow: ' + soon.map(t => t.text).join(', ');
    el.hidden = false;
  }

  function fmtDate(s) {
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function btn(label, cls, fn) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'small ' + cls;
    b.textContent = label;
    const names = { '✏️': 'Edit', '🗑️': 'Delete' };
    if (names[label]) { b.title = names[label]; b.setAttribute('aria-label', names[label]); }
    b.onclick = fn;
    return b;
  }

  function priSelect(value, onchange) {
    const sel = document.createElement('select');
    sel.title = 'Priority';
    ['high', 'medium', 'low'].forEach(p => {
      const o = document.createElement('option');
      o.value = p;
      o.textContent = p[0].toUpperCase() + p.slice(1);
      if (p === value) o.selected = true;
      sel.appendChild(o);
    });
    if (onchange) sel.onchange = onchange;
    return sel;
  }

  function catSelect(value) {
    const sel = document.createElement('select');
    sel.title = 'Category';
    CATS.forEach(c => {
      const o = document.createElement('option');
      o.value = o.textContent = c;
      if (c === value) o.selected = true;
      sel.appendChild(o);
    });
    return sel;
  }

  function render() {
    list.innerHTML = '';
    renderAlert();
    // Sort: category group (Home, Work, Others), then priority (high first),
    // then due date (earliest first, none last), then added order
    const sorted = todos.slice().sort((a, b) =>
      CATS.indexOf(a.category) - CATS.indexOf(b.category) ||
      ORDER[a.priority] - ORDER[b.priority] ||
      (a.due || '9999').localeCompare(b.due || '9999'));
    let lastCat = null;
    sorted.forEach(t => {
      if (t.category !== lastCat) {
        lastCat = t.category;
        const h = document.createElement('li');
        h.className = 'group';
        h.textContent = t.category;
        list.appendChild(h);
      }
      const li = document.createElement('li');
      li.className = 'p-' + t.priority + (t.done ? ' done' : '');

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = t.done;
      cb.onchange = () => { t.done = cb.checked; save(); render(); };
      li.appendChild(cb);

      if (editing === t) {
        const box = document.createElement('div');
        box.className = 'editbox';
        const ti = document.createElement('input');
        ti.type = 'text'; ti.value = t.text; ti.placeholder = 'Task';
        const cs = catSelect(t.category);
        const di = document.createElement('input');
        di.type = 'date'; di.value = t.due;
        const ps = priSelect(t.priority);
        const commit = () => {
          const v = ti.value.trim();
          if (v) t.text = v;
          t.category = cs.value;
          t.due = di.value;
          t.priority = ps.value;
          editing = null; save(); render();
        };
        ti.onkeydown = e => {
          if (e.key === 'Enter') commit();
          if (e.key === 'Escape') { editing = null; render(); }
        };
        box.append(ti, cs, di, ps,
          btn('Save', '', commit),
          btn('Cancel', 'edit', () => { editing = null; render(); }));
        li.appendChild(box);
        list.appendChild(li);
        setTimeout(() => { ti.focus(); ti.select(); });
        return;
      }

      const main = document.createElement('div');
      main.className = 'main';
      const span = document.createElement('div');
      span.className = 'text';
      span.textContent = t.text;
      main.appendChild(span);

      const meta = document.createElement('div');
      meta.className = 'meta';
      const b = document.createElement('span');
      b.className = 'badge';
      b.textContent = t.category;
      meta.appendChild(b);
      if (t.due) {
        const d = document.createElement('span');
        const overdue = t.due < today();
        const isSoon = t.due === tomorrow();
        d.className = 'due' + (overdue ? ' overdue' : isSoon ? ' soon' : '');
        d.textContent = isSoon ? 'Due tomorrow' : (overdue ? 'Overdue: ' : 'Due: ') + fmtDate(t.due);
        meta.appendChild(d);
      }
      main.appendChild(meta);
      li.appendChild(main);

      const sel = priSelect(t.priority);
      sel.className = 'pri';
      sel.onchange = () => { t.priority = sel.value; save(); render(); };
      li.appendChild(sel);

      li.appendChild(btn('✏️', 'edit', () => { editing = t; render(); }));
      li.appendChild(btn('🗑️', 'del', () => {
        todos.splice(todos.indexOf(t), 1);
        if (editing === t) editing = null;
        save(); render();
      }));
      list.appendChild(li);
    });
  }

  document.getElementById('form').onsubmit = e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    todos.push({
      text,
      done: false,
      priority: document.getElementById('newPri').value,
      category: document.getElementById('newCat').value,
      due: document.getElementById('newDue').value
    });
    input.value = '';
    document.getElementById('newDue').value = '';
    save(); render();
  };

  todos.length = 0;
  todos.push(
    { text: 'Buy boiler', done: false, priority: 'high', category: 'Home', due: tomorrow() },
    { text: 'Send quarterly report to the whole finance team', done: false, priority: 'medium', category: 'Work', due: '2099-03-01' },
    { text: 'Call mum', done: false, priority: 'low', category: 'Others', due: '' },
    { text: 'Book dentist', done: true, priority: 'low', category: 'Others', due: '' }
  );
  save = function () {};
  document.body.style.paddingTop = '40px'; /* room for the phone's notch / status bar */
  render();
</script>
</body>
</html>
